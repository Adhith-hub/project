<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnHub-Registration</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <nav>
        <a href="index.html">Home</a> 
        <a href="courses.html">Courses</a> 
        <a href="course-details.html">Course Details</a> 
        <a href="register.html">Register</a> 
        <a href="about.html">About Us</a> 
        <a href="contact.html">Contact Us</a>
    </nav>
    <form>
        <p>
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="Name"
               placeholder="Enter your name">
        </p>
        <p>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email"
               placeholder="Enter your email">
        </p>
        <p>
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone"
               placeholder="Enter phone number">
        </p>
        <p>
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob">
        </p>
            <p>Gender:
               <input type="radio" id="male" name="gender" value="Male">
               <label for="male">Male</label>
               <input type="radio" id="female" name="gender" value="Female">
               <label for="female">Female</label>
               <input type="radio" id="other" name="gender" value="Other">
               <label for="other">Other</label>
            </p>
        <p>
            <label for="qualification">Educational Qualification:</label>
            <select id="qualification" name="qualification">
                  <option value="">Select Qualification</option>
                  <option value="Plus Two">Plus Two</option>
                  <option value="Diploma">Diploma</option>
                  <option value="Degree">Degree</option>
                  <option value="Other">Other</option>
            </select>
        </p>
        <p>
            <label for="course">Select Course:</label>
            <select id="course" name="course">
                <option value="">Select Course</option>
                <option value="HTML">HTML</option>
                <option value="CSS">CSS</option>
                <option value="JavaScript">JavaScript</option>
                <option value="Python">Python</option>
                <option value="Java">Java</option>
            </select>
        </p>
        <p>Preferred Learning Mode:
                <input type="radio" id="online" name="mode" value="Online" required>
                <label for="online">Online</label>
                <input type="radio" id="offline" name="mode" value="Offline">
                <label for="offline">Offline</label>
        </p>
        <p>
            <input type="checkbox" id="terms" name="terms" value="accepted">
            <label for="terms">I agree to the terms and conditions.</label>
        </p>
           <button type="submit">Submit</button>
           <button type="reset">Reset</button>
           <p>&copy;2026 LearnHub</p>
    </form>
    

    
</body>
</html>
